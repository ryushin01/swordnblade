name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build · Storybook · E2E
    runs-on: ubuntu-latest
    env:
      # E2E에서 쇼핑몰의 /admin을 로컬 어드민 서버(3102)로 넘기도록 빌드합니다.
      ADMIN_ORIGIN: http://localhost:3102
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # ESLint(Next.js 규칙, import 정렬) + FSD 규칙(Steiger)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @snb/shop exec playwright install --with-deps chromium
      # 모든 스토리를 실제 브라우저(Chromium)에서 렌더링하고 접근성 검사(axe)까지 실행
      - run: pnpm test:storybook
      # Storybook(public/storybook)을 포함한 프로덕션 빌드
      - run: pnpm build
      # 프로덕션 빌드(next start)에서 업무 흐름, 접근성(axe), 화면 넘침을 검사
      - run: pnpm --filter @snb/shop e2e
      - run: pnpm --filter @snb/admin e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7
